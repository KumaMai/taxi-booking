name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://taxi_user:taxi_pass_ci@localhost:5432/taxi_booking
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      EMAIL_USER: ci@example.com
      EMAIL_PASS: ci-placeholder
      EMAIL_TO: ci@example.com
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      E2E_EXPECT_SUPER_ADMIN: "true"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taxi_user
          POSTGRES_PASSWORD: taxi_pass_ci
          POSTGRES_DB: taxi_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxi_user -d taxi_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start production server
        run: pnpm start > server.log 2>&1 &
      - name: Wait for production server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1
      - name: Run runtime smoke checks
        run: node scripts/runtime-smoke.mjs
      - name: Run browser smoke tests
        run: python scripts/e2e_smoke.py
      - name: Run Admin browser tests
        run: python scripts/e2e_admin.py
